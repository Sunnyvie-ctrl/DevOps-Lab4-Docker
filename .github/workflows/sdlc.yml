name: sdlc

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --build-arg GITHUB_SHA=${{ github.sha }} -t citybike:${{ github.sha }} .
      - name: Save Docker image to tar
        run: docker save citybike:${{ github.sha }} -o /tmp/citybike.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: citybike-image
          path: /tmp/citybike.tar

  staging:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - name: Load image and run Staging Gate
        run: |
          docker load -i /tmp/citybike.tar
          docker rm -f citybike-gate 2>/dev/null || true
          docker run -d --name citybike-gate -p 4173:4173 -e APP_ENV=staging citybike:${{ github.sha }}
          
          # Retry loop with a timeout (waits up to 30 seconds for /health to answer)
          timeout 30 bash -c 'until curl -f -s http://localhost:4173/health > /dev/null; do sleep 1; done'
          
          ./scripts/test-staging.sh
          docker rm -f citybike-gate

  uat:
    needs: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - name: Load image and run UAT Gate
        run: |
          docker load -i /tmp/citybike.tar
          docker rm -f citybike-gate 2>/dev/null || true
          docker run -d --name citybike-gate -p 4173:4173 -e APP_ENV=uat citybike:${{ github.sha }}
          
          timeout 30 bash -c 'until curl -f -s http://localhost:4173/health > /dev/null; do sleep 1; done'
          
          ./scripts/test-uat.sh
          docker rm -f citybike-gate

  oat:
    needs: uat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - name: Load image and run OAT Gate
        run: |
          docker load -i /tmp/citybike.tar
          docker rm -f citybike-gate 2>/dev/null || true
          docker run -d --name citybike-gate -p 4173:4173 -e APP_ENV=oat citybike:${{ github.sha }}
          
          timeout 30 bash -c 'until curl -f -s http://localhost:4173/health > /dev/null; do sleep 1; done'
          
          ./scripts/test-oat.sh
          docker rm -f citybike-gate

  preprod:
    needs: oat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - name: Load image and run Preprod Gate
        run: |
          docker load -i /tmp/citybike.tar
          docker rm -f citybike-gate 2>/dev/null || true
          docker run -d --name citybike-gate -p 4173:4173 -e APP_ENV=preprod -e PROD_API_KEY=${{ secrets.PROD_API_KEY }} citybike:${{ github.sha }}
          
          timeout 30 bash -c 'until curl -f -s http://localhost:4173/health > /dev/null; do sleep 1; done'
          
          export IMAGE_NAME=citybike:${{ github.sha }}
          ./scripts/test-preprod.sh
          
          docker rm -f citybike-gate

  prod:
    needs: preprod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: citybike-image
          path: /tmp
      - name: Load image and run Prod Gate
        run: |
          docker load -i /tmp/citybike.tar
          docker rm -f citybike-gate 2>/dev/null || true
          docker run -d --name citybike-gate -p 4173:4173 -e APP_ENV=production -e PROD_API_KEY=${{ secrets.PROD_API_KEY }} citybike:${{ github.sha }}
          
          timeout 30 bash -c 'until curl -f -s http://localhost:4173/health > /dev/null; do sleep 1; done'
          
          ./scripts/test-prod.sh
          docker rm -f citybike-gate